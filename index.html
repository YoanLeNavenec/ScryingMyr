<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrying Myr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/chat.css">
    <link rel="stylesheet" href="styles/history.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
      <nav class="app-nav">
        <img src="assets/LogoSimply.png" alt="A silver myr reading a book" class="app-logo">
        <ul>
          <li class="nav-item"><button aria-label="chat with Myr" data-view="chat-view"><i data-lucide="message-circle"></i><span>Chat</span></button></li>
          <li class="nav-item"><button aria-label="view chat history" data-view="history-view"><i data-lucide="history"></i><span>Chat History</span></button></li>
          <li class="nav-item"><button aria-label="use deckbuilding assistant" data-view="deckbuilding-view"><i data-lucide="layout-grid"></i><span>Deckbuilding Assistant</span></button></li>
          <li class="nav-item"><button aria-label="export or import decks" data-view="export-import-view"><i data-lucide="arrow-left-right"></i><span>Export/Import</span></button></li>
        </ul>
        <div class="nav-bottom">
          <button class="dark-light" aria-label="switch light/dark mode"><i data-lucide="sun-moon"><span>Light/Dark mode</span></i></button>
        </div>
      </nav>
      <main class="app-main">
        <div class="chat-view view active-view">
          <div class="chat-history">
          </div>
          <div class="chat-input-area">
            <textarea class="chat-input" placeholder="What's on your mind?"></textarea>
            <button class="chat-send-button"><i data-lucide="send"></i></button>
          </div>
        </div>
        <div class="history-view view hidden">
          <div class="history-empty">
            <p>No conversations yet.</p>
            <p>Start asking me questions to see your history here!</p>
          </div>
        </div>
        <div class="deckbuilding-view view hidden">
          <div class="view-empty">
            <p>In what format are we building today?</p>
            <p>Ask me directly or choose one above!</p>
          </div>
        </div>
        <div class="export-import-view view hidden">
          <div class="view-empty">
            <p>No deck loaded yet!</p>
            <p>Build a deck first, or maybe import one!</p>
          </div>
        </div>
      </main>
    </div>
    <script>lucide.createIcons();</script>
    <script src="scripts/chat.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/nav.js"></script>
</body>
</html>
