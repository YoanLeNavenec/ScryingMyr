<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrying Myr</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/chat.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
      <nav class="app-nav">
        <img src="assets/LogoSimply.png" alt="A silver myr reading a book" class="app-logo">
        <ul>
          <li class="nav-item"><i data-lucide="message-circle"></i><span>Chat</span></li>
          <li class="nav-item"><i data-lucide="layout-grid"></i><span>Deckbuilding Assistant</span></li>
          <li class="nav-item"><i data-lucide="arrow-left-right"></i><span>Export/Import</span></li>
        </ul>
        <div class="nav-bottom">
          <button class="dark-light"><i data-lucide="sun-moon"><span>Light/Dark mode</span></i></button>
        </div>
      </nav>
      <main class="app-main">
        <div class="chat-container">
          <div class="chat-history">
          </div>
          <div class="chat-input-area">
            <textarea class="chat-input" placeholder="What's on your mind?"></textarea>
            <button class="chat-send-button"><i data-lucide="send"></i></button>
          </div>
        </div>
      </main>
    </div>
    <script>lucide.createIcons();</script>
    <script src="scripts/chat.js"></script>
    <script src="scripts/theme.js"></script>
</body>
</html>
